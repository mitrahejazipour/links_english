<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mitra Hejazipour – Links</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <main class="card">
      <!-- Cover + avatar -->
      <header class="card-header">
        <img src="img/cover.avif" alt="Chessboard background" class="cover" />

        <div class="avatar-wrapper">
          <img src="img/icon.png" alt="Portrait of Mitra Hejazipour" class="avatar" />
        </div>
      </header>

      <!-- Profile -->
      <section class="profile">
        <h1>Mitra Hejazipour</h1>
        <p class="tagline">Woman Grandmaster</p>

        <div class="socials">
          <a href="https://instagram.com/Mitrahejazipour" target="_blank" aria-label="Instagram Mitra Hejazipour">
            <i class="fa-brands fa-instagram"></i>
          </a>
          <a href="https://x.com/MitraHejazipour" target="_blank" aria-label="X / Twitter">
            <i class="fa-brands fa-x-twitter"></i>
          </a>
          <a href="https://www.linkedin.com/in/mitra-hejazipour" target="_blank" aria-label="LinkedIn">
            <i class="fa-brands fa-linkedin-in"></i>
          </a>
        </div>
      </section>

      <!-- Main links -->
      <section class="links">


        <a class="link-card" href="https://mitrahejazipour.com/" target="_blank" rel="noopener noreferrer">
          <span class="link-icon" aria-hidden="true">
            <img src="icons/noun_Globe_8379641_@700.png" alt="" />
          </span>
          <span class="link-text">
            <span class="link-title">Mitrahejazipour.com</span>
          </span>
        </a>


        <a class="link-card" href="https://mitrachess.com" target="_blank">
          <div class="link-icon--application" aria-hidden="true">
            <img src="icons/noun_Chess_8375955_@700.png" alt="" />
          </div>
          <div class="link-text">
            <div class="link-title">  MitraChess.com</div>
            <div class="link-subtitle">Chess video lessons in Persian</div>
          </div>
        </a>






        <!-- Private lessons – English -->
        <a class="link-card" href="https://docs.google.com/forms/d/e/1FAIpQLSdqJ6xx0SuCLsSGPfQhkefo_idjK5eouBFmRlTNL0RIrrTL9A/viewform?usp=header" target="_blank">
          <div class="link-icon--application" aria-hidden="true">
            <img src="icons/noun_Teacher_8365751_@700.png" alt="" />
          </div>
          <div class="link-text">
            <div class="link-title">Apply for Private Chess Lessons</div>
            <div class="link-subtitle">Français · English · Persian</div>
          </div>
        </a>

        

        

        

        

        

        
      </section>

      <footer class="footer">
        <p>© <span id="year"></span> Mitra Hejazipour – All rights reserved.</p>
      </footer>
    </main>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
